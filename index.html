<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINTER EDITION | Armani Stronger With You Intensely</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg: #050505;
            --surface: #0e0e10;
            --card-bg: rgba(20, 20, 23, 0.75);
            --border: rgba(255, 255, 255, 0.12);
            --accent-white: #ffffff;
            --accent-silver: #c0c0c0;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Canvas зі снігом */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .brand-logo {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
        }

        .brand-logo .snowflake {
            font-size: 14px;
            color: var(--accent-silver);
        }

        .cart-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .cart-count {
            background: #fff;
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Hero Section */
        .hero {
            padding: 180px 8% 80px;
            text-align: center;
            position: relative;
            z-index: 3;
        }

        .winter-tag {
            display: inline-block;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-silver);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(36px, 5vw, 64px);
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
            max-width: 550px;
            margin: 0 auto;
        }

        /* Catalog Section */
        .catalog-section {
            padding: 40px 8% 120px;
            position: relative;
            z-index: 3;
            max-width: 1100px;
            margin: 0 auto;
        }

        .products-grid {
            display: flex;
            justify-content: center;
        }

        /* Виправлена картка товару */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(25px);
            width: 100%;
            max-width: 480px; /* Оптимальна ширина щоб пропорції були красивими */
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .product-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
        }

        .badge-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #fff;
            color: #000;
            z-index: 4;
        }

        /* Блок зображення з правильними пропорціями */
        .product-image-box {
            width: 100%;
            height: 380px; /* Достатня висота, щоб зображення не плющилося */
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            border: 1px solid var(--border);
        }

        .product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Запобігає розтягуванню/деформації */
            object-position: center;
            filter: grayscale(0.2) contrast(1.1);
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .product-card:hover .product-image-box img {
            transform: scale(1.03);
            filter: grayscale(0) contrast(1.1);
        }

        .product-brand {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .product-title {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        /* Вибір об'єму */
        .volume-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .vol-btn {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vol-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: 700;
        }

        /* Нижня частина картки */
        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }

        .product-price {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .add-cart-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .add-cart-btn:hover {
            background: var(--accent-silver);
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            padding: 40px 8%;
            background: #000;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            position: relative;
            z-index: 3;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #fff;
            color: #000;
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            transform: translateY(150px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Снігопад -->
    <canvas id="snowCanvas"></canvas>

    <!-- Тост сповіщення -->
    <div class="toast" id="toast">Переходимо в Telegram... ❄️</div>

    <!-- Header -->
    <header>
        <a href="#" class="brand-logo"><span class="snowflake">❄</span> SCENT WINTER</a>
        <button class="cart-btn">
            <span>Кошик</span>
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="winter-tag">Winter Collection 2026</div>
        <h1>Солодке Зимове Тепло</h1>
        <p>Ідеальний зігріваючий шлейф ванілі, тоффі та прянощів для холодної пори року.</p>
    </section>

    <!-- Catalog Section -->
    <section class="catalog-section">
        <div class="products-grid">
            
            <!-- Картка парфуму -->
            <div class="product-card" id="armaniCard" data-current-link="https://t.me/c/4464199592/11">
                <div class="badge-status">В наявності</div>
                
                <!-- Блок із фотографією -->
                <div class="product-image-box">
                    <img src="./armani.jpg" alt="Armani Stronger With You Intensely">
                </div>

                <div class="product-brand">Giorgio Armani</div>
                <div class="product-title">Stronger With You Intensely</div>

                <!-- Перемикач об'єму -->
                <div class="volume-selector">
                    <button class="vol-btn active" data-price="250" data-link="https://t.me/c/4464199592/11" onclick="selectVolume(this)">3 мл</button>
                    <button class="vol-btn" data-price="420" data-link="https://t.me/c/4464199592/11" onclick="selectVolume(this)">5 мл</button>
                    <button class="vol-btn" data-price="780" data-link="https://t.me/c/4464199592/11" onclick="selectVolume(this)">10 мл</button>
                </div>

                <!-- Нижня панель замовлення -->
                <div class="product-bottom">
                    <div class="product-price" id="armaniPrice">250 ₴</div>
                    <button class="add-cart-btn" onclick="buyCurrentVolume()">Замовити</button>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 SCENT WINTER. Елітна парфумерія на розпив.</p>
    </footer>

    <script>
        // Анімація падіння снігу на Canvas
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const snowflakes = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius: Math.random() * 2 + 0.5,
            density: Math.random() * 0.5 + 0.2,
            opacity: Math.random() * 0.5 + 0.2
        }));

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';

            snowflakes.forEach(flake => {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.globalAlpha = flake.opacity;
                ctx.fill();

                flake.y += flake.density;
                flake.x += Math.sin(flake.y / 30) * 0.3;

                if (flake.y > canvas.height) {
                    flake.y = -5;
                    flake.x = Math.random() * canvas.width;
                }
            });

            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // Логіка перемикання об'єму
        let count = 0;
        function selectVolume(btn) {
            const card = btn.closest('.product-card');
            
            card.querySelectorAll('.vol-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const price = btn.getAttribute('data-price');
            document.getElementById('armaniPrice').innerText = price + ' ₴';

            const link = btn.getAttribute('data-link');
            card.setAttribute('data-current-link', link);
        }

        // Кнопка замовлення
        function buyCurrentVolume() {
            const card = document.getElementById('armaniCard');
            const link = card.getAttribute('data-current-link');
            
            count++;
            document.getElementById('cartCount').innerText = count;

            const toast = document.getElementById('toast');
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
                window.open(link, '_blank');
            }, 600);
        }

        // GSAP Початкова анімація
        gsap.from(".product-card", {
            duration: 1,
            y: 40,
            opacity: 0,
            ease: "power3.out"
        });
    </script>
</body>
</html>
